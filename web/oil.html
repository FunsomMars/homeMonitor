<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>油价监控 · 家庭监控</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { min-height: 100%; background: #ffffff; }
    body { overflow: visible; }
    main { max-width: none; margin: 0; padding: 0; }
    /* 油价页背景与 gold.html 一致：覆盖 common.css 的 --bg 偏绿色 (#f3f6f5) */
    :root { --bg: #ffffff; }
    body { background: var(--bg); }
    /* 油价版两列：右侧"最近一次调价 + 地图"上下排布 */
    .row2-oil { grid-template-columns: 1fr 1.3fr; align-items: stretch; gap: 24px; }
    .row2-oil .stack { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
    .row2-oil .stack > div { display: flex; flex-direction: column; min-height: 0; }
    .row2-oil .stack > div:last-child { flex: 1; }
    .row2-oil #map { height: 100%; min-height: 460px; flex: 1; }
    /* 左侧调价历史：与右侧高度等高，标题对齐到顶部 */
    .row2-oil > section:first-child { display: flex; flex-direction: column; justify-content: flex-start; }
    /* "最近一次调价"取消卡片外框，改为扁平样式 + 紧凑 */
    .adjust-inline {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: 8px 18px; margin-top: 8px; padding: 4px 0;
    }
    .adjust-inline .item { display: inline-flex; align-items: baseline; gap: 6px; }
    .adjust-inline .item strong { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .adjust-inline .item small { color: var(--muted); font-size: 12px; }
    .adjust-inline .item.up strong { color: var(--up); }
    .adjust-inline .item.down strong { color: var(--down); }
    .adjust-inline .meta { width: 100%; color: var(--muted); font-size: 12px; margin-top: 4px; }
    @media (max-width: 800px) {
      .row2-oil { grid-template-columns: 1fr; }
      .row2-oil #map { min-height: 360px; }
      .row2-oil > section:first-child { justify-content: flex-start; }
    }
  </style>
  <!-- ECharts 本地化：避免无外网时图表库加载失败 -->
  <script src="/vendor/echarts.min.js" defer></script>
</head>
<body>
<main>
  <!-- 功能模块 1：省份选择 / 油品选择 -->
  <section>
    <h2>当前油价 <span class="hint" id="asOf"></span></h2>
    <div class="toolbar">
      <span class="label">省份：</span>
      <select id="province"></select>
      <span class="label" style="margin-left:12px">油品：</span>
      <button data-fuel="92" class="active">92#</button>
      <button data-fuel="95">95#</button>
      <button data-fuel="98">98#</button>
      <button data-fuel="0">0# 柴油</button>
      <span style="margin-left:auto;color:var(--muted);font-size:12px" id="lastAdjust"></span>
    </div>
    <div id="fuelGrid" class="fuel-grid"></div>
  </section>

  <!-- 功能模块 2：涨跌幅统计 + 趋势曲线 + 时间范围 -->
  <section>
    <h2>趋势分析 <span class="hint" id="rangeHint"></span></h2>
    <div class="toolbar">
      <span class="label">时间范围：</span>
      <button data-days="30">近 1 月</button>
      <button data-days="90">近 3 月</button>
      <button data-days="365" class="active">近 1 年</button>
      <button data-days="3650">全部</button>
    </div>
    <div class="stat-row" id="statRow"></div>
    <div id="oilChart"></div>
  </section>

  <!-- 功能模块 3：左侧调价历史；右侧 最近一次调价 + 全国 92# 油价地图 -->
  <div class="row2 row2-oil">
    <section>
      <h2>调价历史</h2>
      <table class="tbl" id="adjTable">
        <thead><tr><th>生效时间</th><th>汽油 元/吨</th><th>柴油 元/吨</th><th>来源</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section class="stack">
      <div>
        <h2>最近一次调价</h2>
        <div class="adjust-inline" id="adjustCard">
          <span class="item"><strong id="adjGasoline">—</strong><small>汽油 元/吨</small></span>
          <span class="item"><strong id="adjDiesel">—</strong><small>柴油 元/吨</small></span>
          <span class="meta" id="adjMeta">—</span>
        </div>
      </div>
      <div>
        <h2 style="margin-top:6px">全国 92# 油价地图</h2>
        <div id="map"></div>
        <div class="sub" style="margin-top:6px">颜色：红=高 绿=低（基于 31 省当前价）</div>
      </div>
    </section>
  </div>

  <footer>数据源：江苏省发改委 / 国家发改委 / 东方财富。页面每 30 秒刷新一次。</footer>
</main>
<script src="/common.js"></script>
<script>
const PROVINCES = ["北京","天津","河北","山西","内蒙古","辽宁","吉林","黑龙江","上海","江苏","浙江","安徽","福建","江西","山东","河南","湖北","湖南","广东","广西","海南","重庆","四川","贵州","云南","西藏","陕西","甘肃","青海","宁夏","新疆"];
let state = { province: '江苏', fuel: '92', days: 365 };

const $ = id => document.getElementById(id);

// 来源字段中文化：内部标识 → 用户能看懂的中文标签
const SOURCE_LABEL = {
  jsfgw: '江苏省发改委',
  national_fgw: '国家发改委',
  eastmoney: '东方财富',
};
function fmtSource(s) {
  if (!s || s === 'seed') return '';
  return SOURCE_LABEL[s] || s;
}

// 初始化省份下拉
$('province').innerHTML = PROVINCES.map(p => `<option value="${p}"${p===state.province?' selected':''}>${p}</option>`).join('');

document.querySelectorAll('button[data-fuel]').forEach(b => {
  b.onclick = () => {
    state.fuel = b.dataset.fuel;
    document.querySelectorAll('button[data-fuel]').forEach(x => x.classList.toggle('active', x === b));
    refreshAll();
  };
});
document.querySelectorAll('button[data-days]').forEach(b => {
  b.onclick = () => {
    state.days = Number(b.dataset.days);
    document.querySelectorAll('button[data-days]').forEach(x => x.classList.toggle('active', x === b));
    refreshAll();
  };
});
$('province').onchange = e => { state.province = e.target.value; refreshAll(); };

// ---------- 当前价 ----------
async function loadCurrent() {
  const data = await HM.getJSON(`/api/oil/current?province=${encodeURIComponent(state.province)}`);
  $('asOf').textContent = data.as_of ? `生效 ${HM.fmtTime(data.as_of)}` : '';
  const grid = $('fuelGrid');
  grid.innerHTML = (data.items || []).map(it => {
    const src = it.source_display || it.source || '';
    const meta = src
      ? `生效 ${HM.fmtTime(it.effective_at)} · ${HM.esc(src)}`
      : `生效 ${HM.fmtTime(it.effective_at)}`;
    return `
    <div class="fuel-item confidence-${HM.esc(it.confidence || 'official')}">
      <div class="label">${HM.esc(it.type)}# 汽油${it.type === '0' ? '（柴油）' : ''}</div>
      <div class="price">${Number(it.price).toFixed(2)} <small>元/升</small></div>
      <div class="meta">${meta}</div>
    </div>`;
  }).join('') || '<div class="empty">暂无数据</div>';

  if (data.last_adjustment) {
    const a = data.last_adjustment;
    $('lastAdjust').textContent = `最近调价：${HM.fmtDate(a.effective_at)} 汽油${a.gasoline_change>=0?'+':''}${a.gasoline_change} 柴油${a.diesel_change>=0?'+':''}${a.diesel_change}`;
  } else {
    $('lastAdjust').textContent = '';
  }
}

// ---------- 历史曲线 + 涨跌幅统计 ----------
let chart;
async function loadHistory() {
  const data = await HM.getJSON(`/api/oil/history?province=${encodeURIComponent(state.province)}&type=${state.fuel}&days=${state.days}`);
  $('rangeHint').textContent = `共 ${data.series.length} 个数据点`;
  const s = data.stats || {};
  $('statRow').innerHTML = `
    <div class="stat"><small>区间起始</small><strong>${HM.fmtDate(s.first_date)} · ${s.first_value ?? '—'} 元</strong></div>
    <div class="stat"><small>当前</small><strong>${HM.fmtDate(s.last_date)} · ${s.last_value ?? '—'} 元</strong></div>
    <div class="stat"><small>涨跌</small><strong class="${(s.delta||0)>=0?'up':'down'}">${s.delta!=null?(s.delta>=0?'+':'')+s.delta.toFixed(2)+' 元':'—'}</strong></div>
    <div class="stat"><small>涨跌幅</small><strong class="${(s.delta_pct||0)>=0?'up':'down'}">${s.delta_pct!=null?(s.delta_pct>=0?'+':'')+s.delta_pct.toFixed(2)+'%':'—'}</strong></div>
  `;
  if (!chart && window.echarts) chart = echarts.init($('oilChart'));
  if (!chart) return;
  const adjustments = data.adjustments || [];
  const adjX = adjustments.map(a => a.date);
  const pricesByDate = new Map((data.series || []).map(p => [p.date, p.value]));
  // 调价日可能没有单独的油价采样点；将它加入分类轴，虚线仍可落在真实调价日期。
  const chartDates = Array.from(new Set([...pricesByDate.keys(), ...adjX])).sort();
  const adjSeries = chartDates.map(date => ({
    value: pricesByDate.has(date) ? pricesByDate.get(date) : null,
    itemStyle: adjX.includes(date) ? { color: '#c5453a' } : null,
  }));
  const adjustmentValue = a => state.fuel === '0' ? a.diesel_change : a.gasoline_change;
  chart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 50, right: 20, top: 30, bottom: 50 },
    xAxis: { type: 'category', data: chartDates, axisLabel: { rotate: 30 } },
    yAxis: { type: 'value', name: '元/升', scale: true },
    // 仅保留鼠标滚轮缩放（inside），去掉底部蓝条 slider 保持清爽
    dataZoom: [{ type: 'inside' }],
    series: [{
      name: state.fuel + '#', type: 'line', smooth: true, connectNulls: true, data: adjSeries,
      lineStyle: { width: 2, color: '#167c80' },
      areaStyle: { color: 'rgba(22,124,128,0.08)' },
      markLine: {
        symbol: 'none',
        data: adjustments.map(a => ({
          xAxis: a.date,
          label: { formatter: `调价\n${adjustmentValue(a)>=0?'+':''}${adjustmentValue(a)}`, color: '#c5453a' },
          lineStyle: { color: '#c5453a', type: 'dashed' },
        })),
      },
    }],
  }, true);
}

// ---------- 调价历史 ----------
async function loadAdjustments() {
  const data = await HM.getJSON('/api/oil/adjustments?limit=10');
  const evs = data.events || [];
  $('adjTable').querySelector('tbody').innerHTML = evs.map(e => {
    const src = e.source_display || e.source || '';
    return `
    <tr>
      <td>${HM.fmtTime(e.effective_at)}</td>
      <td class="${e.gasoline_change>=0?'up':'down'}">${e.gasoline_change>=0?'+':''}${e.gasoline_change}</td>
      <td class="${e.diesel_change>=0?'up':'down'}">${e.diesel_change>=0?'+':''}${e.diesel_change}</td>
      <td>${src ? HM.esc(src) : '—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" class="empty">暂无调价记录</td></tr>';
  if (evs.length) {
    const a = evs[0];
    $('adjGasoline').textContent = (a.gasoline_change >= 0 ? '+' : '') + a.gasoline_change;
    $('adjGasoline').parentElement.className = 'item ' + (a.gasoline_change >= 0 ? 'up' : 'down');
    $('adjDiesel').textContent = (a.diesel_change >= 0 ? '+' : '') + a.diesel_change;
    $('adjDiesel').parentElement.className = 'item ' + (a.diesel_change >= 0 ? 'up' : 'down');
    const src = a.source_display || a.source || '';
    const parts = [`生效 ${HM.fmtTime(a.effective_at)}`];
    if (src) parts.push(HM.esc(src));
    if (a.notice_url) parts.push(HM.esc(a.notice_url));
    $('adjMeta').textContent = parts.join(' · ');
  }
}

// ---------- 地图 ----------
// Aliyun GeoJSON 用全称（如"北京市"），但数据/显示用简称（如"北京"），
// ECharts 按名匹配会全部失败并显示 NAN；建立双向映射。
const MAP_NAME_MAP = {
  "北京": "北京市", "天津": "天津市", "河北": "河北省", "山西": "山西省",
  "内蒙古": "内蒙古自治区", "辽宁": "辽宁省", "吉林": "吉林省", "黑龙江": "黑龙江省",
  "上海": "上海市", "江苏": "江苏省", "浙江": "浙江省", "安徽": "安徽省",
  "福建": "福建省", "江西": "江西省", "山东": "山东省", "河南": "河南省",
  "湖北": "湖北省", "湖南": "湖南省", "广东": "广东省", "广西": "广西壮族自治区",
  "海南": "海南省", "重庆": "重庆市", "四川": "四川省", "贵州": "贵州省",
  "云南": "云南省", "西藏": "西藏自治区", "陕西": "陕西省", "甘肃": "甘肃省",
  "青海": "青海省", "宁夏": "宁夏回族自治区", "新疆": "新疆维吾尔自治区",
};
let mapChart;
async function loadMap() {
  let data;
  try {
    data = await HM.getJSON('/api/oil/map');
  } catch (e) { return; }
  if (!data || !data.data) return;
  const container = $('map');
  if (!mapChart) mapChart = echarts.init(container);
  const seriesData = data.data.map(d => ({
    name: MAP_NAME_MAP[d.name] || d.name,
    value: d.value,
  }));
  mapChart.setOption({
    backgroundColor: '#ffffff',
    tooltip: { trigger: 'item', formatter: p => {
      const v = (typeof p.value === 'number' && Number.isFinite(p.value)) ? `${p.value.toFixed(2)} 元/升` : '暂无数据';
      return `${p.name}<br/>${v}`;
    }},
    visualMap: {
      min: data.min, max: data.max, left: 20, top: 20,
      orient: 'vertical',
      inRange: { color: ['#2f8f4d', '#f3e96b', '#c5453a'] },
      text: ['高', '低'], calculable: true,
      itemWidth: 12, itemHeight: 120,
      textStyle: { color: '#687582', fontSize: 11 },
    },
    series: [{
      name: '92#', type: 'map', map: 'china',
      data: seriesData,
      label: { show: false },
      emphasis: { label: { show: true, color: '#17212b', fontWeight: 600 } },
      itemStyle: { areaColor: '#fafafa', borderColor: '#bbb', borderWidth: 0.6 },
    }],
  });
  // 容器大小变化时同步调整
  requestAnimationFrame(() => mapChart && mapChart.resize());
}
// ECharts 地图需要 china GeoJSON；本地提供，避免外网/CORS 问题
function registerChinaMap() {
  if (window.__chinaRegistered) return;
  fetch('/geo/china.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(geo => { echarts.registerMap('china', geo); window.__chinaRegistered = true; loadMap(); })
    .catch((e) => { $('map').innerHTML = `<div class="empty">地图数据加载失败：${HM.esc(e.message)}</div>`; });
}

async function refreshAll() {
  try {
    await Promise.all([loadCurrent(), loadHistory(), loadAdjustments()]);
    parent.postMessage({ type: 'child-status', text: `在线 · ${new Date().toLocaleTimeString()}` }, '*');
  } catch (e) {
    parent.postMessage({ type: 'child-status', text: '服务不可用：' + e.message }, '*');
  }
}

// echarts 用 defer 加载，本 inline 脚本在文档解析后立即执行，defer 脚本尚未跑完。
// 等 echarts 可用后再启动：先注册地图、再首次拉数据、最后开始轮询。
function whenEchartsReady(cb) {
  if (window.echarts) return cb();
  const start = Date.now();
  const wait = setInterval(() => {
    if (window.echarts) { clearInterval(wait); cb(); }
    else if (Date.now() - start > 15000) {
      clearInterval(wait);
      parent.postMessage({ type: 'child-status', text: '图表库加载失败' }, '*');
    }
  }, 50);
}
whenEchartsReady(() => {
  registerChinaMap();
  refreshAll();
  setInterval(refreshAll, 30000);
});
addEventListener('resize', () => { chart && chart.resize(); mapChart && mapChart.resize(); });

// 上报内容高度给父页
function reportHeight() {
  const h = Math.max(
    document.documentElement.scrollHeight,
    document.body ? document.body.scrollHeight : 0
  );
  parent.postMessage({ type: 'child-height', height: h }, '*');
}
reportHeight();
addEventListener('resize', reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
setTimeout(reportHeight, 500);
setTimeout(reportHeight, 1500);
</script>
</body>
</html>
