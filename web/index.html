<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家庭监控中心</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    .tabs { display: flex; gap: 6px; margin-top: 12px; }
    .tabs a {
      text-decoration: none; color: var(--ink);
      border: 1px solid var(--line); background: white;
      padding: 8px 16px; border-radius: 9px; font-size: 14px;
    }
    .tabs a.active { border-color: var(--accent); background: var(--accent); color: white; }
    .frame-wrap { margin-top: 16px; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; background: var(--card); }
    iframe { width: 100%; height: calc(100vh - 220px); min-height: 720px; border: 0; display: block; }
    .overview { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 800px) { .overview { grid-template-columns: 1fr; } }
    .overview .card { display: block; }
    .overview h2 { margin: 0 0 8px; font-size: 18px; }
    .overview .big { font-size: 32px; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>家庭监控中心</h1>
      <div class="sub">温湿度 + 油价 · 本地服务</div>
    </div>
    <div id="status" class="status">连接中…</div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#dashboard" data-tab="dashboard" class="active">概览</a>
    <a href="#temp"      data-tab="temp">温度监控</a>
    <a href="#oil"       data-tab="oil">油价监控</a>
  </nav>

  <!-- 概览面板 -->
  <div id="dashboardPane">
    <div class="overview">
      <div class="card">
        <h2>温度监控</h2>
        <div class="sub" id="ovTemp">加载中…</div>
        <p><a href="#temp" data-tab="temp">→ 打开温度监控</a></p>
      </div>
      <div class="card">
        <h2>油价监控</h2>
        <div class="sub" id="ovOil">加载中…</div>
        <p><a href="#oil" data-tab="oil">→ 打开油价监控</a></p>
      </div>
    </div>
  </div>

  <!-- 子页 iframe -->
  <div id="framePane" class="frame-wrap" style="display:none">
    <iframe id="frame" src=""></iframe>
  </div>

  <footer>服务：<code>python3 -m server --port 8787</code> · 监听 127.0.0.1</footer>
</main>
<script src="/common.js"></script>
<script>
const TABS = ['dashboard', 'temp', 'oil'];
const URLS = { temp: '/temp', oil: '/oil' };

function setTab(tab) {
  if (!TABS.includes(tab)) tab = 'dashboard';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  const dash = $('dashboardPane'), frame = $('framePane');
  if (tab === 'dashboard') {
    dash.style.display = ''; frame.style.display = 'none';
  } else {
    dash.style.display = 'none'; frame.style.display = '';
    $('frame').src = URLS[tab];
  }
  location.hash = '#' + tab;
}

function $(id) { return document.getElementById(id); }

document.querySelectorAll('#tabs a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    setTab(a.dataset.tab);
  });
});
addEventListener('hashchange', () => setTab(location.hash.replace('#', '')));

// 概览数据
async function loadOverview() {
  try {
    const devs = await HM.getJSON('/api/devices');
    const ok = devs.filter(d => d.latest).length;
    $('ovTemp').textContent = ok ? `${ok} 个设备在线，最近采样 ${HM.fmtTime(Math.max(...devs.filter(d=>d.latest).map(d => new Date(d.latest.observed_at).getTime())))}` : '暂无设备';
  } catch (e) { $('ovTemp').textContent = '服务不可用'; }
  try {
    const oil = await HM.getJSON('/api/oil/current?province=江苏');
    const p92 = (oil.items || []).find(i => i.type === '92');
    $('ovOil').textContent = p92 ? `江苏 92# ${p92.price.toFixed(2)} 元/升 · 生效 ${HM.fmtTime(p92.effective_at)}` : '暂无数据';
  } catch (e) { $('ovOil').textContent = '油价服务未启动'; }
  $('status').textContent = `在线 · ${new Date().toLocaleTimeString()}`;
}

setTab(location.hash.replace('#', '') || 'dashboard');
loadOverview();
setInterval(loadOverview, 30000);
</script>
</body>
</html>
